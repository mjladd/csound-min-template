# Renders every piece on each push, in the same image as the dev container.
name: render

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container: ghcr.io/mjladd/csound-min-workspace:7.0.0-min.3

    env:
      SSDIR: ${{ github.workspace }}/samples
      SADIR: ${{ github.workspace }}/analysis
      INCDIR: ${{ github.workspace }}/include

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Make the analysis files
        run: csd analyze

      - name: Render every piece
        run: |
          for piece in pieces/*.csd; do
              echo "==> $piece"
              csd render "$piece"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/*.wav
          if-no-files-found: error
